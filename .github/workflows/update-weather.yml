name: Update SaveEcoBot Data

on:
  schedule:
    # GitHub may delay cron under load; every 20 min is a practical compromise
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Download station
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://www.saveecobot.com/station/25862.json" \
            -o data/station.json
          python3 -c "import json; json.load(open('data/station.json')); print('station.json OK')"

      - name: Download AQI history
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://www.saveecobot.com/maps/marker-popup-v2/uk/device/25862/aqi.json" \
            -o data/aqi.json
          python3 -c "import json; d=json.load(open('data/aqi.json')); assert 'history' in d; print('aqi.json OK', len(d.get('history') or []))"

      - name: Download Open-Meteo (48h)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://api.open-meteo.com/v1/forecast?latitude=50.278178&longitude=28.617254&hourly=temperature_2m,relative_humidity_2m,surface_pressure&past_days=2&timezone=Europe%2FKyiv&forecast_days=1" \
            -o data/meteo_raw.json
          python3 << 'PY'
          import json
          from datetime import datetime, timezone, timedelta
          raw = json.load(open("data/meteo_raw.json"))
          if raw.get("error"):
              raise SystemExit(raw.get("reason", "meteo error"))
          h = raw["hourly"]
          # Kyiv is UTC+3 (EEST) in Oct; API already returns local wall times
          now = datetime.now(timezone(timedelta(hours=3)))
          start = now - timedelta(hours=48)
          end = now + timedelta(minutes=30)
          out = {"temp": [], "humidity": [], "pressure_mmhg": []}
          for i, t in enumerate(h["time"]):
              # t like 2026-10-14T21:00
              try:
                  dt = datetime.fromisoformat(t).replace(tzinfo=timezone(timedelta(hours=3)))
              except Exception:
                  continue
              if dt < start or dt > end:
                  continue
              if h["temperature_2m"][i] is None:
                  continue
              out["temp"].append([t, h["temperature_2m"][i]])
              out["humidity"].append([t, h["relative_humidity_2m"][i]])
              p_hpa = h["surface_pressure"][i]
              out["pressure_mmhg"].append([t, round(p_hpa * 0.750061683, 1)])
          json.dump(out, open("data/meteo.json", "w"), ensure_ascii=False, separators=(",", ":"))
          print("meteo.json points", len(out["temp"]))
          PY
          rm -f data/meteo_raw.json

      - name: Stamp update time
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/updated_at.txt
          echo "Updated at $(cat data/updated_at.txt)"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/station.json data/aqi.json data/meteo.json data/updated_at.txt
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Update weather data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
