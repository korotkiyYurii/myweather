name: Update SaveEcoBot Data

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Download station
        run: curl -L https://www.saveecobot.com/station/25862.json -o data/station.json

      - name: Show files
        run: ls -la data
      - name: Download station
        run: |
          curl -L https://www.saveecobot.com/station/25862.json -o data/station.json

      - name: Check file
        run: |
          ls -lah data
          cat data/station.json | head -20

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/station.json

          git commit -m "Update station data" || echo "Nothing to commit"

          git push

          - name: Download AQI history
  run: |
    curl -L "https://www.saveecobot.com/maps/marker-popup-v2/uk/device/25862/aqi.json" \
    -o data/aqi.json
