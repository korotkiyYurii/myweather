name: Update SaveEcoBot Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Download station
        run: |
          curl -L https://www.saveecobot.com/station/25862.json -o data/station.json

      - name: Download AQI history
        run: |
          curl -L https://www.saveecobot.com/maps/marker-popup-v2/uk/device/25862/aqi.json -o data/aqi.json

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/*.json

          git diff --staged --quiet || git commit -m "Update weather data"

          git push
