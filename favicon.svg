<svg xmlns="http://w3.org" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Soft sky background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    
    <!-- Warm sun core gradient -->
    <linearGradient id="sunGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Rounded square app/favicon backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Sun Rays -->
  <g stroke="#FDE047" stroke-width="28" stroke-linecap="round">
    <line x1="256" y1="68" x2="256" y2="108" />
    <line x1="256" y1="404" x2="256" y2="444" />
    <line x1="68" y1="256" x2="108" y2="256" />
    <line x1="404" y1="256" x2="444" y2="256" />
    <line x1="123" y1="123" x2="151" y2="151" />
    <line x1="361" y1="361" x2="389" y2="389" />
    <line x1="389" y1="123" x2="361" y2="151" />
    <line x1="151" y1="361" x2="123" y2="389" />
  </g>

  <!-- Center Sun Circle -->
  <circle cx="256" cy="256" r="108" fill="url(#sunGrad)" />
</svg>
